schema_version: benchmark_v2_sau_fno_training_config/1
experiment: direct_sau_fno
model_architecture: sau_fno2d_direct_conditioned
prediction_mode: direct_temperature_sau_fno
target: absolute_temperature_K
direct_target_normalization: train_standard
epochs: 100
batch_size: 64
lr: 0.001
metadata_hidden_dim: 64
metadata_embedding_dim: 64
fno_capacity_profile: fno_small
fno_width: 32
fno_layers: 6
fno_modes_x: 12
fno_modes_y: 12
fno_activation: gelu
fno_metadata_conditioning: film
fno_projection_channels: 64
ufno_adaptation_profile: ufno_published_adapted
ufno_reference_commit: 8315fd7b5bd75282b7efe42ee6b8de86543d13cc
ufno_unet_branch_indices: [3, 4, 5]
ufno_unet_depth: 3
ufno_unet_dropout: 0.0
ufno_domain_padding: 8
ufno_padding_mode: published_mixed
ufno_branch_fusion: add
sau_fno_adaptation_profile: sau_fno_paper_adapted
sau_attention_enabled: true
