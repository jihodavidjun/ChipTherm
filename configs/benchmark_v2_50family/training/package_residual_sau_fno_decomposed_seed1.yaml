schema_version: benchmark_v2_sau_fno_training_config/1
experiment: residual_sau_fno
model_architecture: sau_fno2d_residual_decomposed_conditioned
prediction_mode: residual_decomposed_sau_fno
target: source_superposition_residual_K
residual_target_formula: HotSpot_K - source_superposition_base_K
reconstruction_formula: source_superposition_base_K + total_power_W * delta_R_eff_pred_K_per_W + zero_mean_centered_field_K
mean_correction_sign: 1
centered_correction_sign: 1
epochs: 100
batch_size: 64
lr: 0.001
metadata_hidden_dim: 64
metadata_embedding_dim: 64
fno_capacity_profile: fno_small
fno_width: 32
fno_layers: 6
fno_modes_x: 12
fno_modes_y: 12
fno_activation: gelu
fno_metadata_conditioning: film
fno_projection_channels: 64
ufno_adaptation_profile: ufno_published_adapted
ufno_reference_commit: 8315fd7b5bd75282b7efe42ee6b8de86543d13cc
ufno_unet_branch_indices: [3, 4, 5]
ufno_unet_depth: 3
ufno_unet_dropout: 0.0
ufno_domain_padding: 8
ufno_padding_mode: published_mixed
ufno_branch_fusion: add
sau_fno_adaptation_profile: sau_fno_paper_adapted
sau_attention_enabled: true
sau_attention_placement: after_final_ufourier_block
sau_attention_type: single_head_unscaled_spatial_self_attention
sau_attention_dim: 32
sau_number_of_heads: 1
sau_softmax_axis: key_token_axis_-1
sau_fusion_rule: softmax(Q @ K^T, dim=-1) @ W_h(V)
physics_input: source_superposition_v1
mean_head_mode: residual_resistance
physical_representation: dimensional
channel_routing_mode: dimensional_baseline
lambda_final: 1.0
lambda_mean: 0.1
scheduler: none
early_stopping_patience: 20
checkpoint_frequency: 10
graph_enabled: false
seed: 1
