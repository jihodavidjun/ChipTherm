# PROPOSAL ONLY. This file is not an executable benchmark configuration.
schema_version: benchmark_v2_design_proposal/0.1
benchmark_id: benchmark_v2_50family
status: proposal_not_approved_for_generation
sample_count: 10000
family_count: 50
workloads_per_family: 200
legacy_benchmark:
  benchmark_id: benchmark_v1_20family
  policy: immutable_separate_benchmark
  include_in_primary_v2: false
  allowed_use: backward_compatibility_and_cross_benchmark_transfer_only

family_semantics:
  fixed_within_family:
    - package_width_mm
    - package_height_mm
    - grid_rows
    - grid_cols
    - chiplet_count
    - chiplet_names_types_and_rectangles
    - material_stack
    - cooling_configuration
    - HotSpot_configuration
  varied_within_family:
    - chiplet_activity
    - chiplet_power_W
    - chiplet_power_density_W_per_mm2
  forbidden_in_v2_0:
    - material_variation
    - cooling_variation
    - grid_resolution_variation
    - transient_targets
    - geometry_resampling_per_workload

conventions:
  target: steady_state_temperature
  target_unit: K
  geometry_unit: mm
  power_unit: W
  power_density_unit: W_per_mm2
  grid_rows: 64
  grid_cols: 64
  active_workload: nominal
  ambient_policy: fixed_and_recorded
  source_superposition_assumption: linear_steady_state
  path_contract: relative_to_declared_data_root
  checksum_algorithm: sha256

taxonomy_counts:
  hpc: 8
  memory_heavy: 4
  compute_heavy: 4
  mixed_heterogeneous: 7
  analog_mems: 4
  sparse_low_die: 3
  dense_high_die: 3
  compact_clustered: 3
  distributed: 3
  edge_constrained: 2
  package_scale_aspect: 3
  chiplet_size_aspect: 2
  whitespace: 2
  spacing: 2
  package_material_cooling: 0

