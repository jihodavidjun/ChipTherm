workload_allocation:
  low_balanced: 20
  low_sparse_or_type_specific: 15
  medium_balanced: 35
  medium_type_specific: 25
  medium_skewed: 20
  high_balanced_dense: 20
  high_single_dominant: 20
  high_interacting_multi_source: 25
  sparse_active_subset_stress: 10
  dense_active_subset_stress: 10
  total: 200
  sampling:
    method: deterministic_stratified_or_latin_hypercube
    joint_variables: [total_power_W, dominant_share, active_count, active_types, interaction_distance]
    enforce_type_power_density_bounds: true
    duplicate_identity: sha256_of_power_assignment_and_fixed_family_uid
    near_duplicate_audit: required
    inactive_power_policy: low_positive_idle_floor_pending_review

split_protocols:
  sample_split:
    train_workloads_per_family: 160
    val_workloads_per_family: 20
    test_workloads_per_family: 20
    totals: {train: 8000, val: 1000, test: 1000}
  primary_family_split:
    train_families: 40
    val_families: [f007, f012, f023, f030, f041]
    test_families: [f008, f016, f027, f033, f044]
    totals: {train: 8000, val: 1000, test: 1000}
  rotational_family_folds:
    group_count: 10
    families_per_group: 5
    policy: test_group_k_val_group_k_plus_1_train_remaining_groups
  package_physics_ood:
    enabled: false
    reason: current_inputs_do_not_represent_varying_material_or_cooling

source_response_policy:
  train_targets_from_train_families_only: true
  test_family_targets_allowed_for_oracle_only: true
  canonical_isolation_frequency: once_per_source_per_fixed_family
  per_workload_isolation_forbidden: true
  checkpoint_must_record_family_set_hash: true

stage_gates:
  stage_1: specification_and_nearest_family_review
  stage_2: five_families_times_ten_workloads
  stage_3: ten_families_times_fifty_workloads
  stage_4: fifty_families_times_two_hundred_workloads
  full_generation_approved: false

unresolved_decisions:
  - persistent_project_storage_root_quota_backup_and_owner
  - institutional_scratch_root_and_retention_window
  - authoritative_per_type_power_density_ranges
  - structural_near_duplicate_distance_and_review_threshold
  - low_positive_idle_floor_or_explicit_zero_power_support
  - exact_50_fixed_layouts_and_candidate_seeds
  - number_of_rotational_folds_to_publish
  - independent_external_baseline_for_publication
